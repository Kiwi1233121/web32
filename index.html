<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #a0c4ff, #d0e8ff); /* fondo azul más bonito */
      overflow: hidden;
      font-family: 'Russo One', sans-serif;
    }

    .message {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 72px;
      color: #003366;
      text-shadow: 4px 4px 10px #fff;
      animation: float 3s ease-in-out infinite;
      z-index: 10;
    }

    .spiderman {
      position: absolute;
      top: 100px;
      width: 100%;
      text-align: center;
      font-size: 40px;
      color: #e50914;
      text-shadow: 2px 2px 6px #000;
      animation: float 4s ease-in-out infinite;
      z-index: 10;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 5;
    }

    .cake {
      position: relative;
      bottom: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: appear 2s ease-in-out;
      z-index: 10;
    }

    .cake-layer {
      width: 250px;
      height: 70px;
      border-radius: 20px;
      background: linear-gradient(to bottom, #ffe8cc, #e6b980);
      margin-bottom: 15px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
      position: relative;
      border: 4px solid #6b3e26;
    }

    .cake-layer.middle {
      width: 210px;
    }

    .cake-layer.top {
      width: 150px;
    }

    .icing {
      position: absolute;
      top: -18px;
      left: 0;
      width: 100%;
      height: 30px;
      background: radial-gradient(circle at 50% 50%, #fff, #ffe0e0);
      border-radius: 50%;
    }

    .candle {
      width: 18px;
      height: 60px;
      background: repeating-linear-gradient(45deg, red, red 5px, yellow 5px, yellow 10px);
      position: absolute;
      top: -75px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 5px;
      box-shadow: 0 0 6px gold;
    }

    .flame {
      position: absolute;
      top: -25px;
      left: -5px;
      width: 24px;
      height: 24px;
      background: radial-gradient(circle, gold 0%, orange 60%, red 100%);
      border-radius: 50%;
      animation: flame 0.4s infinite alternate;
    }

    .cherry {
      position: absolute;
      top: -10px;
      left: 50%;
      width: 14px;
      height: 14px;
      background-color: red;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      width: 50px;
      height: 70px;
      background-color: red;
      border-radius: 50% 50% 45% 45%;
      animation: floatUp 10s linear infinite;
      z-index: 1;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      width: 2px;
      height: 20px;
      background: #333;
      transform: translateX(-50%);
    }

    .confetti {
      position: absolute;
      top: 0;
      width: 8px;
      height: 8px;
      background-color: #ff6347;
      border-radius: 50%;
      animation: confettiFall 3s linear infinite;
    }

    .firework {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: firework 1s ease-out forwards;
      pointer-events: none;
    }

    @keyframes flame {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes appear {
      0% { transform: translateY(100px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-120vh); opacity: 0; }
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    @keyframes firework {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="message">🎉 Happy Birthday 🎉</div>
  <div class="spiderman">🕷️ Spiderman 🕸️</div>
  <div class="container">
    <div class="cake">
      <div class="cake-layer top">
        <div class="icing"></div>
        <div class="cherry"></div>
        <div class="candle">
          <div class="flame"></div>
        </div>
      </div>
      <div class="cake-layer middle">
        <div class="icing"></div>
        <div class="cherry"></div>
      </div>
      <div class="cake-layer">
        <div class="icing"></div>
        <div class="cherry"></div>
      </div>
    </div>
  </div>
  <script>
    function crearGlobo() {
      const globo = document.createElement("div");
      globo.classList.add("balloon");
      globo.style.left = `${Math.random() * 100}vw`;
      globo.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 65%)`;
      globo.style.animationDuration = `${6 + Math.random() * 6}s`;
      document.body.appendChild(globo);
      setTimeout(() => globo.remove(), 12000);
    }

    function crearConfetti() {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");
      confetti.style.left = `${Math.random() * 100}vw`;
      confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 50%)`;
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 3000);
    }

    function crearFuegosArtificiales() {
      for (let i = 0; i < 60; i++) {  // Aumentamos el número de fuegos artificiales
        const fw = document.createElement("div");
        fw.classList.add("firework");
        fw.style.left = `${50 + Math.random() * 40 - 20}vw`;
        fw.style.top = `${10 + Math.random() * 20}vh`;
        fw.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
        document.body.appendChild(fw);
        setTimeout(() => fw.remove(), 1000);
      }
    }

    setInterval(crearGlobo, 400);
    setInterval(crearConfetti, 100);
    setInterval(crearFuegosArtificiales, 1500);  // Aumentamos la frecuencia de fuegos artificiales
  </script>
</body>
</html>
